services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_interview_db
    environment:
      POSTGRES_DB: ${DB_NAME:-rakamin_development}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rakamin_development"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: ai_interview_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: ai_interview_api
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails db:prepare && bundle exec rails db:seed && bundle exec puma -C config/puma.rb"
    environment:
      RAILS_ENV: development
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev_secret_key_base_rakamin_ai_interview_platform_2026_super_secure}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rakamin_development}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_password}
      REDIS_URL: redis://redis:6379/1
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      PORT: ${PORT:-3001}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      GEMINI_FLASH_MODEL: ${GEMINI_FLASH_MODEL:-gemini-3.8-flash}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-3.1-pro-preview}
    ports:
      - "3001:3001"
    volumes:
      - ./api:/ai-interview
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  sidekiq:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: ai_interview_sidekiq
    command: bundle exec sidekiq -r ./config/environment.rb -C config/sidekiq.yml
    environment:
      RAILS_ENV: development
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev_secret_key_base_rakamin_ai_interview_platform_2026_super_secure}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rakamin_development}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_password}
      REDIS_URL: redis://redis:6379/1
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      PORT: ${PORT:-3001}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      GEMINI_FLASH_MODEL: ${GEMINI_FLASH_MODEL:-gemini-3.8-flash}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-3.1-pro-preview}
    volumes:
      - ./api:/ai-interview
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
