version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_interview_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: rakamin_development
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: ai_interview_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
