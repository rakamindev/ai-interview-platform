services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-interview-postgres
    env_file: .env
    environment:
      POSTGRES_DB: rakamin_development
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai_interview_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rakamin_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    ports:
      - "6379:6379"
    volumes:
      - ai_interview_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ai-interview-minio
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ai_interview_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minio
      INTERVIEW_RECORDINGS_BUCKET: interview-recordings
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$INTERVIEW_RECORDINGS_BUCKET"
        mc anonymous set none "local/$$INTERVIEW_RECORDINGS_BUCKET"

volumes:
  ai_interview_postgres_data:
  ai_interview_redis_data:
  ai_interview_minio_data:
