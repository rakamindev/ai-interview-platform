services:
  postgres:
    image: postgres:16
    container_name: ai-interview-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: rakamin_development
    ports:
      - "5432:5432"
    volumes:
      - ai_interview_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rakamin_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  
  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    ports:
      - "6379:6379"
    volumes:
      - ai_interview_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  

volumes:
  ai_interview_postgres_data:
  ai_interview_redis_data:
