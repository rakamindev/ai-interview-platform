services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rakamin_development}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rakamin_development}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        BUNDLE_WITHOUT: ""
    restart: unless-stopped
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      PORT: 3001
      WEB_CONCURRENCY: 0
      RAILS_MAX_THREADS: 5
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-docker-development-secret-key-base-change-me}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rakamin_development}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_URL: redis://redis:6379/1
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-2.0-flash-live-001}
      GEMINI_FLASH_MODEL: ${GEMINI_FLASH_MODEL:-gemini-2.0-flash-001}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-2.0-pro-001}
      TOKEN_EXPIRATION_TIME: ${TOKEN_EXPIRATION_TIME:-259200}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./api:/ai-interview
      - api_vendor_bundle:/ai-interview/vendor/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        mkdir -p tmp/pids tmp/cache tmp/sockets log &&
        bundle exec ruby bin/rails db:prepare &&
        exec bundle exec ruby -e 'exec Gem.bin_path("puma", "puma"), *ARGV' -- -C config/puma.rb
    healthcheck:
      test:
        - CMD
        - ruby
        - -rnet/http
        - -e
        - >-
          exit(Net::HTTP.get_response(URI('http://localhost:3001/health')).is_a?(Net::HTTPSuccess) ? 0 : 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        BUNDLE_WITHOUT: ""
    restart: unless-stopped
    environment:
      RAILS_ENV: development
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-docker-development-secret-key-base-change-me}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rakamin_development}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_URL: redis://redis:6379/1
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-2.0-flash-live-001}
      GEMINI_FLASH_MODEL: ${GEMINI_FLASH_MODEL:-gemini-2.0-flash-001}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-2.0-pro-001}
      TOKEN_EXPIRATION_TIME: ${TOKEN_EXPIRATION_TIME:-259200}
    volumes:
      - ./api:/ai-interview
      - api_vendor_bundle:/ai-interview/vendor/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - bundle
      - exec
      - ruby
      - -e
      - exec Gem.bin_path("sidekiq", "sidekiq"), *ARGV
      - --
      - -r
      - ./config/environment.rb
      - -C
      - config/sidekiq.yml

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api/v1}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:3001}
      VITE_DEV_TOKEN: ${VITE_DEV_TOKEN:-}
      VITE_DEV_TENANT_ID: ${VITE_DEV_TENANT_ID:-1}
      VITE_DEV_TENANT_NAME: ${VITE_DEV_TENANT_NAME:-Demo Tenant}
      VITE_SPEED_TEST_PING_URL: ${VITE_SPEED_TEST_PING_URL:-}
      VITE_SPEED_TEST_UPLOAD_URL: ${VITE_SPEED_TEST_UPLOAD_URL:-}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  api_vendor_bundle:
  web_node_modules:
