<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect x="20" y="20" width="860" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <text x="45" y="55" font-size="16" font-weight="700" fill="#0f172a">Data Integrity: Assessor Override Preservation Lifecycle</text>
  <text x="45" y="75" font-size="11" fill="#64748b">Preventing accidental destruction of human evaluations during AI portfolio regenerations</text>

  <!-- Left Column: Baseline Flaw -->
  <rect x="45" y="100" width="380" height="330" rx="10" fill="#fff1f2" stroke="#fecdd3" />
  <rect x="65" y="120" width="140" height="24" rx="4" fill="#e11d48" />
  <text x="135" y="136" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">BEFORE: CASCADE WIPE</text>

  <rect x="65" y="160" width="340" height="55" rx="6" fill="#ffffff" stroke="#fda4af" />
  <text x="80" y="180" font-size="11" font-weight="600" fill="#334155">1. Human Assessor Inputs Override:</text>
  <text x="80" y="196" font-size="10.5" fill="#475569">Ruby on Rails: AI L2 → Human L4 (with interview notes)</text>
  <text x="80" y="208" font-size="9.5" fill="#64748b">Saved in assessor_overrides table via foreign key.</text>

  <rect x="65" y="230" width="340" height="55" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5" />
  <text x="80" y="250" font-size="11" font-weight="600" fill="#be123c">2. Portfolio Regeneration Triggered:</text>
  <text x="80" y="267" font-size="10.5" font-family="monospace" fill="#e11d48">portfolio.portfolio_skills.destroy_all</text>
  <text x="80" y="280" font-size="10" fill="#be123c">has_one :assessor_override, dependent: :destroy</text>

  <rect x="65" y="300" width="340" height="55" rx="6" fill="#ffffff" stroke="#fda4af" />
  <text x="80" y="320" font-size="11" font-weight="600" fill="#b91c1c">3. Catastrophic Data Loss:</text>
  <text x="80" y="337" font-size="10.5" fill="#e11d48">Human override permanently deleted from PostgreSQL.</text>
  <text x="80" y="350" font-size="10" fill="#9f1239">Fit/gap report reverts to unadjusted AI score!</text>

  <rect x="65" y="365" width="340" height="50" rx="6" fill="#ffe4e6" />
  <text x="80" y="386" font-size="10.5" font-weight="600" fill="#9f1239">Audit trail erased &amp; human work wasted.</text>

  <!-- Right Column: Monozukuri In-Place Reconciliation -->
  <rect x="475" y="100" width="380" height="330" rx="10" fill="#f0fdf4" stroke="#bbf7d0" />
  <rect x="495" y="120" width="160" height="24" rx="4" fill="#16a34a" />
  <text x="575" y="136" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">AFTER: MONOZUKURI CURE</text>

  <rect x="495" y="160" width="340" height="55" rx="6" fill="#ffffff" stroke="#86efac" />
  <text x="510" y="180" font-size="11" font-weight="600" fill="#166534">1. Pre-Generation State Extraction:</text>
  <text x="510" y="196" font-size="10.5" fill="#475569">Extract existing overrides indexed by skill_id &amp; label.</text>
  <text x="510" y="208" font-size="9.5" fill="#15803d">Cached in memory before modifying database.</text>

  <rect x="495" y="230" width="340" height="55" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
  <text x="510" y="250" font-size="11" font-weight="600" fill="#15803d">2. In-Place Update &amp; Synchronize:</text>
  <text x="510" y="267" font-size="10.5" font-family="monospace" fill="#166534">existing.update!(skill_attrs)</text>
  <text x="510" y="280" font-size="10" fill="#15803d">Update AI level; re-link existing AssessorOverride.</text>

  <rect x="495" y="300" width="340" height="55" rx="6" fill="#ffffff" stroke="#86efac" />
  <text x="510" y="320" font-size="11" font-weight="600" fill="#15803d">3. Guaranteed Preservation:</text>
  <text x="510" y="337" font-size="10.5" fill="#15803d">Override level (L4) and assessor notes intact.</text>
  <text x="510" y="350" font-size="10" fill="#15803d">AI baseline updated (L2 → L3); delta mathematically synced.</text>

  <rect x="495" y="365" width="340" height="50" rx="6" fill="#dcfce7" />
  <text x="510" y="386" font-size="10.5" font-weight="600" fill="#14532d">Zero data loss. Full audit compliance maintained.</text>
</svg>
