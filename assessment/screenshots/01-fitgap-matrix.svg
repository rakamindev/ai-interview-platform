<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Card Container -->
  <rect x="20" y="20" width="840" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="20" y="20" width="840" height="60" rx="12" fill="#f8fafc" />
  <text x="45" y="55" font-size="16" font-weight="600" fill="#0f172a">Vacancy Fit/Gap Evaluation — Tech Lead Architecture</text>
  <rect x="710" y="38" width="125" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="730" y="55" font-size="11" font-weight="500" fill="#475569">✏ 1 Override Applied</text>

  <!-- Table Header -->
  <rect x="40" y="100" width="800" height="38" rx="6" fill="#f1f5f9" />
  <text x="60" y="124" font-size="12" font-weight="600" fill="#475569">SKILL</text>
  <text x="320" y="124" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">REQUIRED</text>
  <text x="500" y="124" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">CANDIDATE EVALUATION</text>
  <text x="730" y="124" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">FIT / GAP RESULT</text>

  <!-- Row 1: React -->
  <line x1="40" y1="185" x2="840" y2="185" stroke="#f1f5f9" stroke-width="1" />
  <text x="60" y="160" font-size="14" font-weight="500" fill="#1e293b">React / Frontend Development</text>
  <text x="60" y="176" font-size="10" font-weight="400" fill="#94a3b8">CONFIDENCE: HIGH</text>
  <text x="320" y="165" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">L3</text>
  <text x="500" y="165" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">L3</text>
  <!-- Match Badge -->
  <rect x="685" y="150" width="90" height="24" rx="4" fill="#dcfce7" />
  <text x="730" y="166" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">✅ Match</text>

  <!-- Row 2: Ruby on Rails (With Override) -->
  <line x1="40" y1="245" x2="840" y2="245" stroke="#f1f5f9" stroke-width="1" />
  <text x="60" y="215" font-size="14" font-weight="500" fill="#1e293b">Ruby on Rails</text>
  <text x="60" y="231" font-size="10" font-weight="400" fill="#94a3b8">CONFIDENCE: MEDIUM</text>
  <text x="320" y="222" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">L4</text>
  <!-- Candidate with Override Badge -->
  <text x="460" y="222" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">L4</text>
  <rect x="480" y="209" width="75" height="20" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
  <text x="517" y="223" font-size="10" font-weight="600" fill="#b45309" text-anchor="middle">✏ Override</text>
  <!-- Match Badge -->
  <rect x="685" y="210" width="90" height="24" rx="4" fill="#dcfce7" />
  <text x="730" y="226" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">✅ Match</text>

  <!-- Row 3: PostgreSQL (Gap) -->
  <line x1="40" y1="305" x2="840" y2="305" stroke="#f1f5f9" stroke-width="1" />
  <text x="60" y="275" font-size="14" font-weight="500" fill="#1e293b">PostgreSQL &amp; Query Tuning</text>
  <text x="60" y="291" font-size="10" font-weight="400" fill="#94a3b8">CONFIDENCE: MEDIUM</text>
  <text x="320" y="282" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">L4</text>
  <text x="500" y="282" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">L2</text>
  <!-- Gap Badge -->
  <rect x="685" y="270" width="90" height="24" rx="4" fill="#fee2e2" />
  <text x="730" y="286" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">⚠ Gap -2</text>

  <!-- Row 4: Distributed Systems (Not Assessed) -->
  <line x1="40" y1="365" x2="840" y2="365" stroke="#f1f5f9" stroke-width="1" />
  <text x="60" y="335" font-size="14" font-weight="500" fill="#1e293b">Distributed Consensus</text>
  <text x="320" y="342" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">L3</text>
  <text x="500" y="342" font-size="12" font-style="italic" fill="#94a3b8" text-anchor="middle">Not assessed</text>
  <!-- Not Assessed Badge -->
  <rect x="680" y="330" width="100" height="24" rx="4" fill="#f1f5f9" />
  <text x="730" y="346" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">— Not Assessed</text>

  <!-- Narrative Card -->
  <rect x="40" y="385" width="800" height="95" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="55" y="408" font-size="12" font-weight="600" fill="#334155">Culture &amp; Competency Fit Summary</text>
  <text x="55" y="428" font-size="11" fill="#475569">Candidate displays deep autonomy in fullstack product delivery and high architectural mentorship capacity.</text>
  <text x="55" y="445" font-size="11" fill="#475569">Human override notes confirm advanced Metaprogramming proficiency; database query optimization identified</text>
  <text x="55" y="462" font-size="11" fill="#475569">as growth area for L4 scale requirements.</text>
</svg>
