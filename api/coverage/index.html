    <script>window.SIMPLECOV_DATA = {"$schema":"https://raw.githubusercontent.com/simplecov-ruby/simplecov/main/schemas/coverage-v1.3.schema.json","meta":{"schema_version":"1.3","simplecov_version":"1.3.2","command_name":"RSpec","command_names":["RSpec"],"project_name":"Api","timestamp":"2026-11-16T23:58:43.477+07:00","root":"/home/haikalardzi/ai-interview-platform/api","commit":"5a1a1f9d2ec107ffe60ba9bf5ef3990472c57812","primary_coverage":"line","line_coverage":true,"branch_coverage":true,"method_coverage":false},"total":{"lines":{"covered":529,"missed":1507,"omitted":2603,"total":2036,"percent":25.982318271119844,"strength":0.7175834970530451},"branches":{"covered":61,"missed":620,"total":681,"percent":8.95741556534508,"strength":0.3671071953010279}},"coverage":{"app/auth/authorize_api_request.rb":{"source":["# frozen_string_literal: true","","require 'ostruct'","","# Extracted and simplified from rakamin-api.","# Bearer token only (no basic auth — AI interview has no whitelist-key consumers).","# Returns { user_id:, role:, scheme: } from the decoded JWT.","# Does NOT hit the database for user lookup — trusts the JWT claims.","class AuthorizeApiRequest","  # Roles that map to \"assessor\" permission in the AI interview context.","  # rakamin-api uses 'admin'; 'assessor' is planned as a future role.","  ASSESSOR_ROLES = %w[admin assessor recruiter hr_manager].freeze","","  def initialize(headers = {}, required_roles = [])","    @headers = headers","    @required_roles = Array(required_roles)","  end","","  # Returns an OpenStruct with :id, :role, :scheme","  def call","    claims = decoded_auth_token","    user_struct = build_user_struct(claims)","","    check_role!(user_struct) if @required_roles.any?","","    { user: user_struct, claims: }","  end","","  private","","  attr_reader :headers","","  def build_user_struct(claims)","    OpenStruct.new(","      id:     claims[:user_id],","      role:   claims[:role].to_s,","      scheme: claims[:scheme].to_s","    )","  end","","  def check_role!(user)","    allowed = @required_roles.map(&:to_s)","","    # :any means no role restriction","    return if allowed.include?('any')","","    # Support logical grouping: :assessor_or_admin","    effective_role = user.role","    if allowed.include?('assessor')","      # Allow anyone whose role is in ASSESSOR_ROLES","      return if ASSESSOR_ROLES.include?(effective_role)","    end","","    return if allowed.include?(effective_role)","","    raise(ExceptionHandler::Unauthorized, Message.unauthorized)","  end","","  def decoded_auth_token","    JsonWebToken.decode(http_auth_header)","  rescue ExceptionHandler::InvalidToken => e","    raise(ExceptionHandler::InvalidToken, e.message)","  end","","  def http_auth_header","    return headers['Authorization'].split(' ').last if headers['Authorization'].present?","","    raise(ExceptionHandler::MissingToken, Message.missing_token)","  end","end"],"lines":[null,null,1,null,null,null,null,null,1,null,null,1,null,1,7,7,null,null,null,1,7,5,null,5,null,4,null,null,1,null,1,null,1,5,null,null,null,null,null,null,1,5,null,null,5,null,null,5,5,null,5,null,null,1,null,1,null,null,1,7,null,1,null,null,1,7,null,1,null,null],"lines_covered_percent":100.0,"covered_lines":29,"missed_lines":0,"omitted_lines":41,"total_lines":29,"branches":[{"type":"then","start_line":24,"end_line":24,"coverage":5,"inline":true,"report_line":24},{"type":"else","start_line":24,"end_line":24,"coverage":0,"inline":true,"report_line":24},{"type":"then","start_line":45,"end_line":45,"coverage":0,"inline":true,"report_line":45},{"type":"else","start_line":45,"end_line":45,"coverage":5,"inline":true,"report_line":45},{"type":"then","start_line":51,"end_line":51,"coverage":5,"inline":false,"report_line":50},{"type":"else","start_line":49,"end_line":52,"coverage":0,"inline":true,"report_line":49},{"type":"then","start_line":51,"end_line":51,"coverage":4,"inline":true,"report_line":51},{"type":"else","start_line":51,"end_line":51,"coverage":1,"inline":true,"report_line":51},{"type":"then","start_line":54,"end_line":54,"coverage":0,"inline":true,"report_line":54},{"type":"else","start_line":54,"end_line":54,"coverage":1,"inline":true,"report_line":54},{"type":"then","start_line":66,"end_line":66,"coverage":6,"inline":true,"report_line":66},{"type":"else","start_line":66,"end_line":66,"coverage":1,"inline":true,"report_line":66}],"branches_covered_percent":66.66666666666667,"covered_branches":8,"missed_branches":4,"total_branches":12},"app/channels/audio_websocket_middleware.rb":{"source":["# frozen_string_literal: true","","require 'faye/websocket'","","# Rack middleware that proxies a WebSocket at /ws/sessions/:id/audio between the browser (16kHz PCM)","# and Gemini Live (24kHz PCM). Audio is buffered in a ring buffer for reconnection replay.","class AudioWebSocketMiddleware","  AUDIO_PATH_PATTERN = %r{\\A/ws/sessions/([^/]+)/audio\\z}","","  MAX_RECONNECT_ATTEMPTS = 3","  RECONNECT_BACKOFF = [1, 2, 4].freeze","  BROWSER_GRACE_PERIOD = 120 # seconds to keep Gemini alive after browser disconnects","  PROACTIVE_RECONNECT_AFTER = ENV.fetch('PROACTIVE_RECONNECT_AFTER', 510).to_i","  PROACTIVE_RECONNECT_JITTER = 30  # randomise to avoid thundering herd","","  SYSTEM_SIGNAL_TOKEN = 'SYS-TC-7x9k'","","  WRAP_UP_SIGNAL = \"[TIME CONTROL:#{SYSTEM_SIGNAL_TOKEN}] { \\\"wrap_up\\\": true, \\\"all_skills_covered\\\": true }\" \\","                   ' — Close the interview NOW. Do NOT ask any more questions.' \\","                   ' Acknowledge their last answer in one sentence, then say goodbye in one sentence.' \\","                   ' Two sentences total, then stop.'","","  def initialize(app)","    @app = app","  end","","  def call(env)","    path = env['PATH_INFO']","    match = AUDIO_PATH_PATTERN.match(path)","","    return @app.call(env) unless match && Faye::WebSocket.websocket?(env)","","    handle_audio_websocket(env, match[1])","  end","","  private","","  def handle_audio_websocket(env, session_id)","    browser_ws = Faye::WebSocket.new(env, nil, ping: 30)","    state = ConnectionState.new","","    browser_ws.on(:open)    { |_event| handle_browser_open(env, session_id, browser_ws, state) }","    browser_ws.on(:message) { |event| handle_browser_frame(event, browser_ws, state, session_id) }","    browser_ws.on(:close)   { |event| handle_browser_close(event, browser_ws, state, session_id) }","","    browser_ws.rack_response","  end","","  def handle_browser_open(env, session_id, browser_ws, state)","    session, error = authenticate_and_load(env, session_id)","","    if error","      browser_ws.send({ type: 'error', code: 'auth_failed', message: error, recoverable: false }.to_json)","      browser_ws.close","      return","    end","","    state.session = session","    connect_to_gemini(browser_ws, state)","  rescue StandardError => e","    Rails.logger.error(\"[AudioWS] Exception in on:open: #{e.class}: #{e.message}\\n#{e.backtrace.first(5).join(\"\\n\")}\")","    browser_ws.close","  end","","  def handle_browser_frame(event, browser_ws, state, session_id)","    if event.data.is_a?(String) && !event.data.start_with?('{')","      forward_audio_frame(event.data, state, session_id)","    else","      handle_browser_message(event.data, browser_ws, state)","    end","  end","","  # Forward audio frame to Gemini when ready; suppress while model is speaking to prevent echo loop.","  def forward_audio_frame(data, state, session_id)","    if state.model_speaking","      # Server-side audio gate: suppress mic while model is speaking to prevent speaker echo loop.","      unless state.logged_gate_suppressed","        Rails.logger.warn(\"[AudioWS] Audio suppressed by model_speaking gate (session=#{session_id})\")","        state.logged_gate_suppressed = true","      end","    elsif state.gemini_client&.accepting_audio?","      state.logged_gate_suppressed = false","      state.gemini_client.send_audio(data)","    else","      # Log once per gap to avoid spam (~33 chunks/s during reconnection).","      unless state.logged_not_ready","        Rails.logger.warn(\"[AudioWS] Audio received but Gemini not ready — buffering (accepting=#{state.gemini_client&.accepting_audio?} connected=#{state.gemini_client&.connected})\")","        state.logged_not_ready = true","      end","    end","  end","","  def handle_browser_close(event, browser_ws, state, session_id)","    Rails.logger.info(\"[AudioWS] Browser disconnected: session=#{session_id} code=#{event.code}\")","    state.browser_disconnected_at = Time.current","    state.proactive_reconnect_timer&.cancel","","    # Keep Gemini alive during grace period in case candidate reconnects via page refresh.","    schedule_graceful_end(browser_ws, state)","  end","","  def connect_to_gemini(browser_ws, state)","    session = state.session","","    ensure_system_prompt(session)","","    unless session.assessment.system_prompt.present?","      send_json(browser_ws, type: 'error', code: 'no_system_prompt',","                            message: 'Assessment configuration is incomplete.', recoverable: false)","      browser_ws.close","      return","    end","","    Sessions::StartHandler.new(session).call unless session.active?","","    state.turn_counter = session.transcript_turns.maximum(:turn_number).to_i","","    # Pre-compute coverage so the first candidate turn has context to inject (no stale/empty cache on turn 1).","    injector = Coverage::MapInjector.new(session)","    state.cached_coverage_text = injector.injection_text","    state.last_coverage_digest = injector.coverage_fingerprint","","    build_gemini_client(browser_ws, state)","    state.gemini_client.connect(resumption_handle: session.gemini_resumption_token.presence)","  end","","  def ensure_system_prompt(session)","    return if session.assessment.system_prompt.present?","","    Rails.logger.warn(\"[AudioWS] system_prompt missing for assessment #{session.assessment.id} — regenerating\")","    Assessments::SystemPromptCompiler.new(session.assessment).call.tap do |prompt|","      session.assessment.update_column(:system_prompt, prompt)","    end","  end","","  def build_gemini_client(browser_ws, state)","    session = state.session","","    state.gemini_client = Gemini::LiveClient.new(","      system_prompt: session.assessment.system_prompt,","      on_audio: build_on_audio(browser_ws, state),","      on_input_transcription: build_on_input_transcription(browser_ws, state, session),","      on_output_transcription: build_on_output_transcription(browser_ws, state, session),","      on_model_turn_complete: build_on_model_turn_complete(browser_ws, state, session),","      on_go_away: ->(time_left:, resumption_token:) { handle_go_away(browser_ws, state, resumption_token) },","      on_close: ->(code:, reason:) { handle_gemini_close(browser_ws, state, code: code, reason: reason) },","      on_error: ->(message) { Rails.logger.error(\"[AudioWS] Gemini error: session=#{session.id} #{message}\") },","      on_resumption_token_update: build_on_resumption_token_update(state, session),","      on_ready: build_on_ready(browser_ws, state, session)","    )","  end","","  def build_on_audio(browser_ws, state)","    lambda { |pcm_bytes|","      # First audio frame of a turn → frontend mutes mic to prevent speaker feedback.","      unless state.model_speaking","        state.model_speaking = true","        state.ai_audio_chunks = 0","        Rails.logger.info('[AudioWS] AI audio started — sending speaker_changed:ai')","        send_json(browser_ws, type: 'speaker_changed', speaker: 'ai')","      end","","      state.ai_audio_chunks = (state.ai_audio_chunks || 0) + 1","","      begin","        browser_ws.send(pcm_bytes.bytes)","      rescue StandardError => e","        Rails.logger.error(\"[AudioWS] Failed to send audio to browser: #{e.class}: #{e.message}\")","      end","    }","  end","","  # Fires once per complete candidate turn (full sentence accumulated).","  def build_on_input_transcription(browser_ws, state, session)","    lambda { |text|","      next unless text.present?","","      turn_number = state.increment_turn!","","      maybe_inject_coverage(state, session)","      maybe_piggyback_wrap_up(state, session)","","      # Push DB writes off the EM thread so audio forwarding doesn't stall.","      Thread.new do","        ActiveRecord::Base.connection_pool.with_connection do","          save_transcript_turn(session, turn_number, 'candidate', text)","          CoverageAnalyzerWorker.perform_async(session.id, turn_number)","          refresh_coverage_cache(session, state)","        end","      rescue StandardError => e","        Rails.logger.error(\"[AudioWS] Thread crashed (input transcription): #{e.class}: #{e.message}\")","      end","","      send_json(browser_ws, type: 'transcription', speaker: 'candidate',","                            text: text, turn_number: turn_number)","","      check_time_ceiling(session, state, browser_ws)","    }","  end","","  # Inject coverage only during GENUINE candidate turns; on_input_transcription also fires from","  # generationComplete when Gemini flushes mid-model-turn, which would trigger a dual response.","  def maybe_inject_coverage(state, session)","    return if state.model_speaking","    return unless state.cached_coverage_text.present?","    return if state.last_coverage_digest == state.last_injected_digest","","    state.gemini_client.inject_context(state.cached_coverage_text)","    state.last_injected_digest = state.last_coverage_digest","    Rails.logger.debug(\"[AudioWS] Coverage injected (digest=#{state.last_coverage_digest&.slice(0, 8)})\")","  end","","  # If the AI ended its last turn with a question, piggyback the wrap-up signal on the candidate's","  # next turn so the AI's response to their answer is the closing rather than another question.","  def maybe_piggyback_wrap_up(state, session)","    return unless state.waiting_for_candidate_response && !state.wrap_up_injected","","    state.gemini_client.inject_context(WRAP_UP_SIGNAL)","    state.wrap_up_injected = true","    state.waiting_for_candidate_response = false","    state.coverage_end_timer&.cancel","    Rails.logger.info(\"[AudioWS] Candidate responded — wrap-up piggybacked on coverage injection (session=#{session.id})\")","  end","","  def build_on_output_transcription(browser_ws, state, session)","    lambda { |text|","      next unless text.present?","","      text = sanitize_output_transcription(text)","      next unless text.present?","","      turn_number = state.increment_turn!","","      Thread.new do","        ActiveRecord::Base.connection_pool.with_connection do","          save_transcript_turn(session, turn_number, 'ai', text)","        end","      rescue StandardError => e","        Rails.logger.error(\"[AudioWS] Thread crashed (output transcription): #{e.class}: #{e.message}\")","      end","","      send_json(browser_ws, type: 'transcription', speaker: 'ai',","                            text: text, turn_number: turn_number)","","      # Track whether the AI's last turn ended with a question — drives wrap-up branching.","      state.last_ai_turn_ends_with_question = text.rstrip.end_with?('?')","","      # Safety net: if AI said closing words, set coverage_pending and schedule a 15s fallback","      # finalizer in case on_model_turn_complete never fires (Gemini sometimes skips turnComplete).","      if !state.ending_scheduled && ai_closing_detected?(text)","        unless state.coverage_pending","          Rails.logger.warn(\"[AudioWS] AI closed without system signal — forcing coverage_pending (session=#{session.id})\")","          state.coverage_pending = true","        end","","        unless state.ending_scheduled","          EM.add_timer(15) do","            next if state.ending_scheduled","            Rails.logger.warn(\"[AudioWS] on_model_turn_complete delayed — finalizing via closing-phrase fallback (session=#{session.id})\")","            state.ending_scheduled = true","            send_json(browser_ws, type: 'preparing_to_end', reason: 'all_covered')","            poll_for_session_end(browser_ws, state, session, attempts: 0)","          end","        end","      end","","      check_time_ceiling(session, state, browser_ws)","    }","  end","","  # Strips coverage/time metadata that leaks into output transcription via realtimeInput.text echoes.","  def sanitize_output_transcription(text)","    text = text.gsub(/\\[COVERAGE[_ ]MAP\\][\\s\\S]*?\\[\\/COVERAGE[_ ]MAP\\]/m, '').strip","    text = text.gsub(/\\[COVERAGE[_ ]MAP[^\\]]*\\]/m, '').strip","    text = text.sub(/\\A\\s*\\{.*?\"discovered\"\\s*:\\s*\\[.*?\\].*?\\}\\s*/m, '').strip","    # Skip up to the last }] (or }) immediately followed by an uppercase letter — covers partial JSON echoes.","    text = text.sub(/\\A[\\s\\S]*?[\\}\\]]+[\\s\\}\\]]*(?=\\p{Lu})/m, '').strip","    text = text.gsub(/\\[TIME[_ ]CONTROL[^\\]]*\\][^\\n]*/m, '').strip","    text = text.gsub(/pacing=\\S+\\s*priority_next=\\S*/m, '').strip","    text = text.gsub(/\\[Start the interview[^\\]]*\\]/m, '').strip","    text = text.gsub(/\\[SESSION RESUME\\][^\\n]*/m, '').strip","    text.gsub(/\\[SISTEM\\][^\\n]*/m, '').strip","  end","","  # Fires after the model's turnComplete — safe to tell the frontend to unmute the mic.","  def build_on_model_turn_complete(browser_ws, state, session)","    lambda {","      Rails.logger.info(\"[AudioWS] Model turn complete — ai_audio_chunks=#{state.ai_audio_chunks || 0} sending speaker_changed:candidate\")","      state.model_speaking = false","      state.ai_audio_chunks = 0","","      # Deferred proactive reconnect fires in the gap between AI response and candidate's next speech.","      if state.reconnect_after_turn","        state.reconnect_after_turn = false","        Rails.logger.info(\"[AudioWS] Executing deferred proactive reconnect (session=#{session.id})\")","        initiate_proactive_reconnect(browser_ws, state)","      end","","      send_json(browser_ws, type: 'speaker_changed', speaker: 'candidate')","","      handle_coverage_auto_end(browser_ws, state, session)","    }","  end","","  # Debounce DB writes — Gemini rotates the token every turn but we only need it persisted as crash-recovery.","  def build_on_resumption_token_update(state, session)","    lambda { |token|","      state.latest_resumption_token = token","","      now = Process.clock_gettime(Process::CLOCK_MONOTONIC)","      next if state.last_token_persisted_at && (now - state.last_token_persisted_at) \u003c 60","","      state.last_token_persisted_at = now","      Thread.new do","        ActiveRecord::Base.connection_pool.with_connection do","          session.update_column(:gemini_resumption_token, token)","        end","      rescue StandardError => e","        Rails.logger.error(\"[AudioWS] Thread crashed (resumption token): #{e.class}: #{e.message}\")","      end","    }","  end","","  def build_on_ready(browser_ws, state, session)","    lambda {","      state.logged_not_ready = false","      if state.reconnecting","        Rails.logger.info(\"[AudioWS] Gemini reconnected for session #{session.id}\")","        state.reconnecting = false","        state.reconnect_attempts = 0","        send_json(browser_ws, type: 'reconnected')","        send_json(browser_ws, type: 'speaker_changed', speaker: 'candidate')","      else","        Rails.logger.info(\"[AudioWS] Gemini ready — sending session_started for session #{session.id}\")","        unless session.gemini_resumption_token.present?","          state.model_speaking = true","          send_json(browser_ws, type: 'speaker_changed', speaker: 'ai')","          state.gemini_client.trigger_opening","        end","        send_json(browser_ws, type: 'session_started', session_id: session.id)","      end","","      schedule_proactive_reconnect(browser_ws, state)","    }","  end","","  # Handles Gemini GoAway — transparent reconnection using resumption token, audio buffered for replay.","  def handle_go_away(browser_ws, state, resumption_token)","    session = state.session","    return unless resumption_token.present?","","    Rails.logger.info(\"[AudioWS] GoAway received for session #{session.id} — reconnecting\")","","    state.proactive_reconnect_timer&.cancel","    state.reconnecting = true","    send_json(browser_ws, type: 'reconnecting')","","    # Reset model_speaking so frontend doesn't stay stuck in muted/AI-speaking state post-reconnect.","    if state.model_speaking","      state.model_speaking = false","      send_json(browser_ws, type: 'speaker_changed', speaker: 'candidate')","    end","","    state.latest_resumption_token = resumption_token","    session.update_column(:gemini_resumption_token, resumption_token)","","    old_client = state.gemini_client","    old_client&.supersede!","","    build_gemini_client(browser_ws, state)","    state.gemini_client.connect(resumption_handle: resumption_token)","    old_client&.close","  end","","  # Handles unexpected Gemini WebSocket close (not GoAway). Audio is buffered during the gap and replayed.","  def handle_gemini_close(browser_ws, state, code:, reason:)","    # Normal close (1000) is intentional unless flagged as inactivity_close (which also uses 1000).","    return if code == 1000 && !state.gemini_client&.inactivity_close","","    state.proactive_reconnect_timer&.cancel","    state.reconnect_attempts ||= 0","","    if state.reconnect_attempts \u003c MAX_RECONNECT_ATTEMPTS","      schedule_gemini_reconnect(browser_ws, state, code)","    else","      Rails.logger.error(\"[AudioWS] Gemini reconnection failed after #{MAX_RECONNECT_ATTEMPTS} attempts\")","      Sessions::EndHandler.new(state.session).call(reason: 'error')","      send_json(browser_ws, type: 'session_ended', reason: 'error',","                            message: 'The session encountered a problem. Please contact the interviewer.')","      browser_ws.close","    end","  end","","  def schedule_gemini_reconnect(browser_ws, state, code)","    backoff = RECONNECT_BACKOFF[state.reconnect_attempts] || 4","    state.reconnect_attempts += 1","    state.reconnecting = true","","    Rails.logger.warn(\"[AudioWS] Gemini closed unexpectedly (code=#{code}) — retry #{state.reconnect_attempts}/#{MAX_RECONNECT_ATTEMPTS} in #{backoff}s\")","    send_json(browser_ws, type: 'reconnecting') if state.reconnect_attempts == 1","    if state.model_speaking","      state.model_speaking = false","      send_json(browser_ws, type: 'speaker_changed', speaker: 'candidate')","    end","","    expected_client = state.gemini_client","    EM.add_timer(backoff) do","      next unless state.gemini_client.equal?(expected_client)","      next if state.session.ended?","","      state.gemini_client&.supersede!","      build_gemini_client(browser_ws, state)","      token = state.latest_resumption_token || state.session.gemini_resumption_token.presence","      state.gemini_client.connect(resumption_handle: token)","    end","  end","","  def handle_browser_message(data, browser_ws, state)","    message = JSON.parse(data)","","    case message['type']","    when 'debug_force_reconnect'","      if Rails.env.development?","        Rails.logger.warn(\"[AudioWS] DEBUG: forcing Gemini disconnect for session #{state.session&.id}\")","        old_client = state.gemini_client","        handle_gemini_close(browser_ws, state, code: 1011, reason: 'debug_force_reconnect')","        old_client&.close","      end","    when 'end_session'","      state.proactive_reconnect_timer&.cancel","      state.graceful_end_timer&.cancel","      state.time_ceiling_timer&.cancel","      state.coverage_end_timer&.cancel","      Sessions::EndHandler.new(state.session).call(reason: 'manual_candidate')","      send_json(browser_ws, type: 'session_ended', reason: 'manual_candidate')","      state.gemini_client&.close","      browser_ws.close","    end","  rescue JSON::ParserError","    # ignore malformed control messages","  end","","  # Schedules a proactive Gemini reconnect ~8.5min in, before Gemini's 10min hard limit triggers a 1011 close.","  def schedule_proactive_reconnect(browser_ws, state)","    state.proactive_reconnect_timer&.cancel","    delay = PROACTIVE_RECONNECT_AFTER + rand(PROACTIVE_RECONNECT_JITTER)","    state.proactive_reconnect_timer = EM::Timer.new(delay) do","      initiate_proactive_reconnect(browser_ws, state)","    end","    Rails.logger.info(\"[AudioWS] Proactive reconnect scheduled in #{delay}s for session #{state.session.id}\")","  end","","  # Starts a new Gemini connection while the old one is still live; swaps in on_ready and replays audio.","  def initiate_proactive_reconnect(browser_ws, state)","    if state.reconnecting","      Rails.logger.info(\"[AudioWS] Proactive reconnect skipped — already reconnecting (session #{state.session.id})\")","      return","    end","","    token = state.latest_resumption_token || state.session.gemini_resumption_token.presence","","    unless token.present?","      Rails.logger.warn(\"[AudioWS] Proactive reconnect: no token yet, rescheduling (session #{state.session.id})\")","      schedule_proactive_reconnect(browser_ws, state)","      return","    end","","    # Don't interrupt mid-conversation — defer until AI finishes its current response.","    if state.model_speaking","      Rails.logger.info(\"[AudioWS] Proactive reconnect deferred — AI speaking (session #{state.session.id})\")","      state.reconnect_after_turn = true","      return","    end","","    # If candidate may still be speaking (silence pump not active), defer until next model turn.","    if state.gemini_client&.connected && !state.gemini_client&.silence_pumping?","      Rails.logger.info(\"[AudioWS] Proactive reconnect deferred — candidate may be speaking (session #{state.session.id})\")","      state.reconnect_after_turn = true","      return","    end","","    Rails.logger.info(\"[AudioWS] Initiating proactive reconnect for session #{state.session.id}\")","    state.reconnecting = true","","    if state.model_speaking","      state.model_speaking = false","      send_json(browser_ws, type: 'speaker_changed', speaker: 'candidate')","    end","","    state.session.update_column(:gemini_resumption_token, token)","","    old_client = state.gemini_client","    old_client&.supersede!","    build_gemini_client(browser_ws, state)","    state.gemini_client.connect(resumption_handle: token)","    # Close old connection after new one is set up to minimise the gap.","    EM.add_timer(2) { old_client&.close }","  end","","  # Cancellable EM timer (vs Thread.new+sleep) — releases on session end without holding a thread for 2min.","  def schedule_graceful_end(browser_ws, state)","    return unless state.session","","    state.graceful_end_timer = EM::Timer.new(BROWSER_GRACE_PERIOD) do","      Thread.new do","        ActiveRecord::Base.connection_pool.with_connection do","          next if state.session.reload.ended?","","          Rails.logger.info(\"[AudioWS] Grace period expired — ending session #{state.session.id}\")","          Sessions::EndHandler.new(state.session).call(reason: 'error')","          EM.schedule { state.gemini_client&.close }","        end","      rescue StandardError => e","        Rails.logger.error(\"[AudioWS] Thread crashed (graceful end): #{e.class}: #{e.message}\")","      end","    end","  end","","  # Sends session_ended then closes both connections; 300ms delay lets the frontend process the JSON","  # before the close event fires, otherwise it shows the reconnection UI instead of the complete screen.","  def close_session_after_end(browser_ws, state, reason:)","    EM.schedule do","      send_json(browser_ws, type: 'session_ended', reason: reason)","      state.gemini_client&.close","      EM.add_timer(0.3) do","        begin","          browser_ws.close","        rescue StandardError","          nil","        end","      end","    end","  end","","  # Only flags pending — actual injection always deferred to handle_coverage_auto_end at a turn-safe point,","  # since model_speaking can be false while AI is mid-generation, which produced question+closing hybrids.","  def schedule_coverage_wrap_up(state, session)","    return if state.coverage_pending || state.ending_scheduled","","    state.coverage_pending = true","    Rails.logger.info(\"[AudioWS] All skills covered — wrap-up pending next AI turn (session=#{session.id})\")","  end","","  # Coverage auto-end logic — called from on_model_turn_complete. Branches on whether AI closed naturally,","  # ended with a question (need wrap-up signal), or already delivered the post-signal closing.","  def handle_coverage_auto_end(browser_ws, state, session)","    # Safety net: if we injected wrap_up but coverage_pending somehow wasn't set, recover.","    state.coverage_pending = true if state.wrap_up_injected && !state.coverage_pending","","    return unless state.coverage_pending && !state.ending_scheduled","","    if state.wrap_up_injected","      finalize_after_wrap_up(browser_ws, state, session)","    elsif state.last_ai_turn_ends_with_question","      wait_for_candidate_then_wrap_up(state, session)","    else","      finalize_natural_close(browser_ws, state, session)","    end","  end","","  def finalize_after_wrap_up(browser_ws, state, session)","    state.coverage_end_timer&.cancel","    state.ending_scheduled = true","    Rails.logger.info(\"[AudioWS] Wrap-up turn complete — finalizing session #{session.id}\")","    send_json(browser_ws, type: 'preparing_to_end', reason: 'all_covered')","    poll_for_session_end(browser_ws, state, session, attempts: 0)","  end","","  # Wait for candidate response before injecting wrap-up so silence pump doesn't fire premature close;","  # 20s fallback in case candidate stays silent.","  def wait_for_candidate_then_wrap_up(state, session)","    state.waiting_for_candidate_response = true","    Rails.logger.info(\"[AudioWS] AI ended with question — waiting for candidate response before wrap-up (session=#{session.id})\")","","    state.coverage_end_timer&.cancel","    state.coverage_end_timer = EM::Timer.new(20) do","      next if state.ending_scheduled || state.wrap_up_injected","","      delivered = state.gemini_client&.inject_context(WRAP_UP_SIGNAL)","      if delivered","        state.wrap_up_injected = true","        state.waiting_for_candidate_response = false","        Rails.logger.info(\"[AudioWS] Candidate silent — wrap-up injected via fallback (session=#{session.id})\")","      end","    end","  end","","  def finalize_natural_close(browser_ws, state, session)","    state.coverage_end_timer&.cancel","    state.ending_scheduled = true","    Rails.logger.info(\"[AudioWS] AI closed naturally — finalizing session #{session.id}\")","    send_json(browser_ws, type: 'preparing_to_end', reason: 'all_covered')","    poll_for_session_end(browser_ws, state, session, attempts: 0)","  end","","  # Polls until the session is ended (via audio_complete API call) or max_attempts is reached.","  def poll_for_session_end(browser_ws, state, session, attempts:)","    max_attempts = 30","","    EM.add_timer(1) do","      Thread.new do","        ActiveRecord::Base.connection_pool.with_connection do","          if session.reload.ended?","            Rails.logger.info(\"[AudioWS] Session #{session.id} ended via audio_complete — closing WebSocket\")","            close_session_after_end(browser_ws, state, reason: 'all_covered')","          elsif attempts >= max_attempts","            Rails.logger.warn(\"[AudioWS] audio_complete poll timed out — ending session #{session.id} directly\")","            Sessions::EndHandler.new(session).call(reason: 'all_covered')","            close_session_after_end(browser_ws, state, reason: 'all_covered')","          else","            EM.schedule { poll_for_session_end(browser_ws, state, session, attempts: attempts + 1) }","          end","        end","      rescue StandardError => e","        Rails.logger.error(\"[AudioWS] Thread crashed (poll session end): #{e.class}: #{e.message}\")","      end","    end","  end","","  # Refreshes cached coverage text from a background thread; assigns digest+text atomically on EM thread","  # to prevent a GVL preemption from pairing a new digest with stale text.","  def refresh_coverage_cache(session, state)","    started  = Process.clock_gettime(Process::CLOCK_MONOTONIC, :millisecond)","    injector = Coverage::MapInjector.new(session)","","    fingerprint = injector.coverage_fingerprint","    if state.last_coverage_digest == fingerprint","      Rails.logger.debug(\"[AudioWS] Coverage unchanged — cache still valid (session=#{session.id})\")","      return","    end","","    text        = injector.injection_text","    all_covered = injector.all_covered?","    elapsed     = Process.clock_gettime(Process::CLOCK_MONOTONIC, :millisecond) - started","","    EM.schedule do","      state.last_coverage_digest = fingerprint","      state.cached_coverage_text = text","","      schedule_coverage_wrap_up(state, session) if all_covered","    end","","    Rails.logger.warn(\"[AudioWS] Coverage cache refresh slow: #{elapsed}ms (session=#{session.id})\") if elapsed > 50","    Rails.logger.debug(\"[AudioWS] Coverage cache refreshed in #{elapsed}ms\")","  rescue StandardError => e","    Rails.logger.error(\"[AudioWS] Coverage cache refresh failed: #{e.message}\")","  end","","  def save_transcript_turn(session, turn_number, speaker, text)","    session.transcript_turns.create!(","      turn_number: turn_number,","      speaker: speaker,","      text: text","    )","  rescue ActiveRecord::RecordNotUnique","    # Duplicate turn — skip silently (idempotent)","  rescue StandardError => e","    Rails.logger.error(\"[AudioWS] Failed to save transcript turn: #{e.message}\")","  end","","  def check_time_ceiling(session, state, browser_ws)","    return unless session.started_at && session.assessment.time_limit_min","    return if state.ending_scheduled","","    elapsed   = (Time.current - session.started_at).to_i","    limit     = session.assessment.time_limit_min * 60","    remaining = limit - elapsed","","    if remaining \u003c= 0","      enforce_time_ceiling(session, state, browser_ws)","    elsif remaining \u003c= 60 && !state.sent_time_warnings.include?(:warn_60)","      mark_warning_if_delivered(state, :warn_60,","        \"[TIME CONTROL:#{SYSTEM_SIGNAL_TOKEN}] { \\\"wrap_up\\\": true }\")","    elsif remaining \u003c= 120 && !state.sent_time_warnings.include?(:warn_120)","      mark_warning_if_delivered(state, :warn_120,","        \"[TIME CONTROL:#{SYSTEM_SIGNAL_TOKEN}] { \\\"time_warning\\\": true }\")","    end","  end","","  def enforce_time_ceiling(session, state, browser_ws)","    # Mark :ceiling sent only if inject_context actually delivered — silence pump can return false (C2 fix).","    mark_warning_if_delivered(state, :ceiling,","      \"[TIME CONTROL:#{SYSTEM_SIGNAL_TOKEN}] { \\\"time_warning\\\": true, \\\"wrap_up\\\": true }\")","","    state.ending_scheduled = true","","    state.time_ceiling_timer = EM::Timer.new(60) do","      Thread.new do","        ActiveRecord::Base.connection_pool.with_connection do","          next if session.reload.ended?","","          Sessions::EndHandler.new(session).call(reason: 'time_ceiling')","          close_session_after_end(browser_ws, state, reason: 'time_ceiling')","        end","      rescue StandardError => e","        Rails.logger.error(\"[AudioWS] Thread crashed (time ceiling): #{e.class}: #{e.message}\")","      end","    end","  end","","  def mark_warning_if_delivered(state, key, signal)","    return if state.sent_time_warnings.include?(key)","    return unless state.gemini_client.inject_context(signal)","","    state.sent_time_warnings.add(key)","  end","","  CLOSING_PHRASES = [","    # English","    'you\\'ll hear back from the team',","    'you\\'ll hear from the team',","    'thank you for your time',","    'thanks for your time',","    'that concludes our interview',","    'that\\'s all for today',","    'good luck',","    # Indonesian — formal env, session_id)","    ws = Faye::WebSocket.new(env, nil, ping: 30)","","    redis_sub = nil  # track subscription Redis instance for cleanup","","    ws.on :open do |_event|","      # Try header-based auth first (assessor dashboard with JWT in header).","      # If no Authorization header is present, wait for a { type: \"auth\", token }","      # message — this matches the pattern used by the audio WS for browser clients","      # that can't set WebSocket headers.","      session, error = authenticate_assessor(env, session_id)","      next if error  # wait for auth message","","      send_current_state(ws, session)","      redis_sub = subscribe_to_coverage_updates(ws, session_id)","    end","","    ws.on :message do |event|","      next unless event.data.is_a?(String)","","      message = JSON.parse(event.data) rescue next","      next unless message['type'] == 'auth'","","      # Already authenticated via header — ignore","      next if redis_sub","","      token   = message['token'].to_s","      session, error = authenticate_assessor_by_token(token, session_id)","","      if error","        ws.send({ type: 'error', code: 'auth_failed', message: error }.to_json)","        ws.close","        next","      end","","      send_current_state(ws, session)","      redis_sub = subscribe_to_coverage_updates(ws, session_id)","    end","","    ws.on :close do |_event|","      Rails.logger.debug(\"[CoverageWS] Assessor disconnected from session #{session_id}\")","      # H4 fix: unsubscribe so the blocking Thread exits cleanly instead of","      # hanging forever waiting for the next message.","      Thread.new { redis_sub&.unsubscribe rescue nil }","    end","","    ws.rack_response","  end","","  def send_current_state(ws, session)","    session.reload","    maps       = session.coverage_maps.configured.order(:id)","    discovered = session.coverage_maps.discovered.order(:id)","","    payload = {","      type:       'coverage_update',","      status:     session.status,","      end_reason: session.end_reason,","      skills:     maps.map { |m| coverage_json(m) },","      discovered: discovered.map { |m| coverage_json(m) }","    }","","    ws.send(payload.to_json)","  rescue => e","    Rails.logger.error(\"[CoverageWS] Failed to send initial state: #{e.message}\")","  end","","  # Returns the Redis instance so the caller can unsubscribe on WS close.","  def subscribe_to_coverage_updates(ws, session_id)","    channel = \"coverage:#{session_id}\"","    redis = Redis.new(url: ENV.fetch('REDIS_URL', 'redis://localhost:6379/1'))","","    Thread.new do","      redis.subscribe(channel) do |on|","        on.message do |_channel, message|","          EM.schedule do","            ws.send(message)","          rescue => e","            Rails.logger.debug(\"[CoverageWS] Failed to forward update: #{e.message}\")","            redis.unsubscribe(channel)","          end","        end","      end","    rescue => e","      Rails.logger.error(\"[CoverageWS] Redis subscription error for #{channel}: #{e.message}\")","    ensure","      redis.disconnect!","    end","","    redis","  end","","  def authenticate_assessor(env, session_id)","    auth_header = env['HTTP_AUTHORIZATION']","    return [nil, 'Missing authorization'] unless auth_header.present?","","    authenticate_assessor_by_token(auth_header.split(' ').last, session_id)","  end","","  def authenticate_assessor_by_token(token, session_id)","    payload = JsonWebToken.decode(token)","","    org = Organization.find_by(scheme: payload[:scheme])","    return [nil, 'Invalid tenant'] unless org","","    session = Session.unscoped.where(tenant_id: org.id).find_by(id: session_id)","    return [nil, 'Session not found'] unless session","","    [session, nil]","  rescue => e","    [nil, \"Authentication failed: #{e.message}\"]","  end","","  def coverage_json(map)","    {","      id:            map.id,","      skill_id:      map.skill_id,","      skill_label:   map.skill_label,","      is_discovered: map.is_discovered,","      state:         map.state,","      probe_count:   map.probe_count,","      last_signal:   map.last_signal","    }","  end","end"],"lines":[null,null,1,null,null,null,1,1,null,1,1,null,null,1,0,0,null,0,null,0,0,null,null,1,null,1,0,null,0,null,0,null,null,null,null,0,0,null,0,0,null,null,0,0,null,0,0,null,null,0,null,0,0,null,0,0,0,0,null,null,0,0,null,null,0,0,null,null,0,null,null,0,null,null,1,0,0,0,null,null,0,null,null,0,0,null,null,0,null,0,null,null,null,1,0,0,null,0,0,0,0,0,null,0,0,null,null,null,null,0,null,0,null,null,0,null,null,1,0,0,null,0,null,null,1,0,null,0,0,null,0,0,null,0,null,0,null,null,1,null,0,null,null,null,null,null,null,null,null,null],"lines_covered_percent":17.80821917808219,"covered_lines":13,"missed_lines":60,"omitted_lines":77,"total_lines":73,"branches":[{"type":"else","start_line":18,"end_line":18,"coverage":0,"inline":true,"report_line":18},{"type":"then","start_line":18,"end_line":18,"coverage":0,"inline":true,"report_line":18},{"type":"then","start_line":37,"end_line":37,"coverage":0,"inline":true,"report_line":37},{"type":"else","start_line":37,"end_line":37,"coverage":0,"inline":true,"report_line":37},{"type":"else","start_line":44,"end_line":44,"coverage":0,"inline":true,"report_line":44},{"type":"then","start_line":44,"end_line":44,"coverage":0,"inline":true,"report_line":44},{"type":"else","start_line":47,"end_line":47,"coverage":0,"inline":true,"report_line":47},{"type":"then","start_line":47,"end_line":47,"coverage":0,"inline":true,"report_line":47},{"type":"then","start_line":50,"end_line":50,"coverage":0,"inline":true,"report_line":50},{"type":"else","start_line":50,"end_line":50,"coverage":0,"inline":true,"report_line":50},{"type":"then","start_line":56,"end_line":58,"coverage":0,"inline":false,"report_line":55},{"type":"else","start_line":55,"end_line":59,"coverage":0,"inline":true,"report_line":55},{"type":"then","start_line":69,"end_line":69,"coverage":0,"inline":true,"report_line":69},{"type":"el ivity_at = nil","      @inactivity_timer = nil","      @last_audio_forwarded_at = nil","      @silence_pump_timer = nil","","      @on_audio = on_audio","      @on_input_transcription = on_input_transcription","      @on_output_transcription = on_output_transcription","      @on_model_turn_complete = on_model_turn_complete","      @on_go_away = on_go_away","      @on_close = on_close","      @on_error = on_error","      @on_ready = on_ready","      @on_resumption_token_update = on_resumption_token_update","    end","","    # Opens the WebSocket and sends setup; resumes a prior session if a handle is provided.","    def connect(resumption_handle: nil)","      @setup_complete = false","      @ws = Faye::WebSocket::Client.new(","        GEMINI_WS_URL,","        nil,","        headers: { 'x-goog-api-key' => @api_key }","      )","","      @ws.on(:open)    { |_event| handle_ws_open(resumption_handle) }","      @ws.on(:message) { |event|  handle_message(event.data) }","      @ws.on(:close)   { |event|  handle_ws_close(event) }","      @ws.on(:error)   { |event|  handle_ws_error(event) }","","      @ws","    end","","    def voice_frame?(pcm_bytes)","      samples = pcm_bytes.unpack('s\u003c*')","      return false if samples.empty?","","      Math.sqrt(samples.sum { |s| s * s } / samples.size.to_f) >= VOICE_RMS_THRESHOLD","    end","","    # Sends raw PCM audio bytes to Gemini Live as realtimeInput.","    def send_audio(pcm_bytes)","      return unless @connected && @ws","","      ensure_inactivity_watchdog","      track_audio_forwarded(pcm_bytes)","","      if voice_frame?(pcm_bytes)","        @user_spoke = true","        schedule_silence_pump # resets stop + timer, so the window restarts on every voiced frame","      elsif @silence_pumping","        return # the pump is already supplying silence, so don't double-feed","      end","","      @ws.send(audio_message(pcm_bytes))","    end","","    # Injects hidden context via realtimeInput.text — same channel as audio, no interleaving conflicts.","    def inject_context(text, turn_complete: true) # turn_complete kept for interface compat, ignored","      return false unless @connected && @ws","","      @ws.send({ realtimeInput: { text: text } }.to_json)","      true","    end","","    # Prompts Gemini to speak first via realtimeInput.text.","    def trigger_opening","      return unless @connected && @ws","","      @ws.send({ realtimeInput: { text: '[Start the interview. Greet the candidate and ask your first question.]' } }.to_json)","      Rails.logger.info('[Gemini::LiveClient] trigger_opening sent')","    end","","    # True when this client is ready to accept audio frames.","    def accepting_audio?","      @connected && @ws && !@superseded","    end","","    def silence_pumping?","      @silence_pumping","    end","","    # Gracefully closes the connection.","    def close","      @inactivity_timer&.cancel","      @gate_timer&.cancel","      stop_silence_pump","      @ws&.close","      @connected = false","    end","","    # Silences callbacks before this client is replaced on GoAway reconnect, preventing event bleed.","    def supersede!","      @superseded = true","      @inactivity_timer&.cancel","      @gate_timer&.cancel","      stop_silence_pump","    end","","    private","","    def handle_ws_open(resumption_handle)","      send_setup(resumption_handle: resumption_handle)","      Rails.logger.info('[Gemini::LiveClient] WebSocket opened — awaiting setupComplete')","    end","","    def handle_ws_close(event)","      @connected = false","      Rails.logger.info(\"[Gemini::LiveClient] Connection closed: code=#{event.code} reason=#{event.reason} superseded=#{@superseded}\")","      # Skip on_close for superseded clients to avoid duplicate reconnect from the replaced instance.","      @on_close&.call(code: event.code, reason: event.reason) unless @superseded","    end","","    def handle_ws_error(event)","      Rails.logger.error(\"[Gemini::LiveClient] WebSocket error: #{event.message}\")","      @on_error&.call(event.message) unless @superseded","    end","","    def activate_connection!","      @connected = true","      Rails.logger.info('[Gemini::LiveClient] Session ready — accepting audio')","      @on_ready&.call","    end","","    def record_activity!","      @last_activity_at = Process.clock_gettime(Process::CLOCK_MONOTONIC)","    end","","    def track_audio_forwarded(pcm_bytes)","      @audio_chunks_forwarded = (@audio_chunks_forwarded || 0) + 1","      @audio_bytes_forwarded = (@audio_bytes_forwarded || 0) + pcm_bytes.bytesize","      @last_audio_forwarded_at = Process.clock_gettime(Process::CLOCK_MONOTONIC)","","      return unless (@audio_chunks_forwarded % 50).zero?","","      Rails.logger.debug(","        \"[Gemini::LiveClient] Audio forwarded: #{@audio_chunks_forwarded} chunks (#{@audio_bytes_forwarded}B total)\"","      )","    end","","    def audio_message(pcm_bytes)","      {","        realtimeInput: {","          audio: {","            mimeType: 'audio/pcm;rate=16000',","            data: Base64.strict_encode64(pcm_bytes)","          }","        }","      }.to_json","    end","","    # Fire-once timer + timestamp avoids EM reactor churn and premature pump firing during intra-sentence pauses.","    def schedule_silence_pump","      stop_silence_pump if @silence_pumping","","      @last_real_audio_at = Process.clock_gettime(Process::CLOCK_MONOTONIC)","","      return if @silence_pump_timer","","      @silence_pump_timer = EM::Timer.new(SILENCE_PUMP_DELAY) do","        @silence_pump_timer = nil","        check_silence_pump_ready","      end","    end","","    # Verifies real silence elapsed since last audio frame; reschedules if audio arrived during the timer window.","    def check_silence_pump_ready","      return if @silence_pumping || !@connected || !@ws || @superseded ||","                !@last_real_audio_at || @model_emitting_audio || !@user_spoke","","      elapsed = Process.clock_gettime(Process::CLOCK_MONOTONIC) - @last_real_audio_at","      remaining = SILENCE_PUMP_DELAY - elapsed","","      if remaining \u003c= 0.02 # close enough — EM timer precision is ~10ms","        start_silence_pump","      else","        @silence_pump_timer = EM::Timer.new(remaining) do","          @silence_pump_timer = nil","          check_silence_pump_ready","        end","      end","    end","","    def start_silence_pump","      return if @silence_pumping || !@connected || !@ws || @model_emitting_audio","","      @silence_pumping = true","      @user_spoke = false # turn handed over, so don't re-trigger until the user speaks again","      Rails.logger.info(\"[Gemini::LiveClient] Silence pump started — no voice for #{SILENCE_PUMP_DELAY}s\")","      ","      silence_msg = {","        realtimeInput: {","          audio: {","            mimeType: 'audio/pcm;rate=16000',","            data: Base64.strict_encode64(SILENCE_FRAME)","          }","        }","      }.to_json.freeze","","      # Pump until: real audio arrives, Gemini responds (turnComplete), or connection closes/supersedes.","      @silence_pump_periodic = EM::PeriodicTimer.new(SILENCE_PUMP_INTERVAL) do","        if !@connected || !@ws || @superseded","          stop_silence_pump","        else","          @ws.send(silence_msg)","        end","      end","    end","","    def stop_silence_pump","      @silence_pump_timer&.cancel","      @silence_pump_timer = nil","      @last_real_audio_at = nil","      @silence_pump_periodic&.cancel","      @silence_pump_periodic = nil","      @silence_pumping = false","    end","","    # Triggers reconnect only when silence is being pumped, so a long candidate monologue doesn't kill the connection.","    def ensure_inactivity_watchdog","      return if @inactivity_timer || @superseded","","      record_activity! unless @last_activity_at","      @inactivity_timer = EM::PeriodicTimer.new(10) do","        next unless @connected && @last_activity_at","","        now = Process.clock_gettime(Process::CLOCK_MONOTONIC)","        idle = now - @last_activity_at","        next unless @silence_pumping && idle >= INACTIVITY_TIMEOUT","","        Rails.logger.warn(\"[Gemini::LiveClient] Inactivity detected (#{idle.round(1)}s, silence pumping) — forcing reconnect\")","        @inactivity_timer&.cancel","        @inactivity_timer = nil","        @inactivity_close = true","        @ws&.close","      end","    end","","    def log_gemini_event(data)","      sc = data['serverContent']","      if sc","        has_audio = sc.dig('modelTurn', 'parts')&.any? { |p| p['inlineData'] }","        has_input_tx = sc.key?('inputTranscription')","        has_output_tx = sc.key?('outputTranscription')","        turn_complete = sc['turnComplete']","        gen_complete = sc['generationComplete']","        interrupted = sc['interrupted']","","        # Skip audio-only frames (too noisy)","        return if has_audio && !has_input_tx && !has_output_tx && !turn_complete && !gen_complete && !interrupted","","        parts = []","        parts \u003c\u003c 'interrupted' if interrupted","        parts \u003c\u003c 'audio' if has_audio","        if has_input_tx","          input_tx_text = sc.dig('inputTranscription', 'parts', 0, 'text') || sc.dig('inputTranscription', 'text')","          parts \u003c\u003c \"inputTx=#{input_tx_text.truncate(50)}\" if input_tx_text.present?","        end","        if has_output_tx","          output_tx_text = sc.dig('outputTranscription', 'parts', 0, 'text') || sc.dig('outputTranscription', 'text')","          parts \u003c\u003c \"outputTx=#{output_tx_text.truncate(50)}\" if output_tx_text.present?","        end","        parts \u003c\u003c 'turnComplete' if turn_complete","        parts \u003c\u003c 'generationComplete' if gen_complete","","        Rails.logger.info(\"[Gemini::LiveClient] Event: #{parts.join(' | ')}\") if parts.any?","      end","","      Rails.logger.info('[Gemini::LiveClient] Event: setupComplete') if data['setupComplete']","      return unless data['sessionResumption'] || data['sessionResumptionUpdate']","","      Rails.logger.info('[Gemini::LiveClient] Event: resumptionToken updated')","    end","","    def send_setup(resumption_handle: nil)","      setup = {","        setup: {","          model: \"models/#{@model}\",","          generationConfig: {","            responseModalities: ['AUDIO'],","            speechConfig: {","              voiceConfig: {","                prebuiltVoiceConfig: { voiceName: @voice }","              }","            }","          },","          systemInstruction: {","            parts: [{ text: @system_prompt }]","          },","          inputAudioTranscription: {},","          outputAudioTranscription: {},","          contextWindowCompression: {","            slidingWindow: {}","          },","          realtimeInputConfig: {","            automaticActivityDetection: {","              endOfSpeechSensitivity: 'END_SENSITIVITY_LOW',","              silenceDurationMs: 1000","            }","          }","        }","      }","","      # sessionResumption must be present on initial connection or Gemini never sends update handles.","      setup[:setup][:sessionResumption] = resumption_handle.present? ? { handle: resumption_handle } : {}","","      @ws.send(setup.to_json)","    end","","    def handle_message(raw_data)","      return if @superseded","","      data = JSON.parse(raw_data)","","      # Only meaningful responses count as activity; token updates do not (they fire even when Gemini stalls).","      record_activity! if data['serverContent'] || data['setupComplete']","","      log_gemini_event(data)","","      handle_audio_response(data)","      handle_input_transcription(data)","      handle_output_transcription(data)","      handle_generation_complete(data)","      handle_interrupted(data)","      handle_turn_complete(data)","      handle_resumption_update(data)","      handle_setup_complete(data)","      handle_go_away_event(data)","    rescue JSON::ParserError => e","      Rails.logger.error(\"[Gemini::LiveClient] Failed to parse message: #{e.message}\")","    end","","    def handle_audio_response(data)","      parts = data.dig('serverContent', 'modelTurn', 'parts')","      return unless parts","","      parts.each do |part|","        next unless (inline = part['inlineData'])","","        stop_silence_pump unless @model_emitting_audio","        @model_emitting_audio = true","        audio_bytes = Base64.strict_decode64(inline['data'])","        @on_audio&.call(audio_bytes)","      end","    end","","    def handle_input_transcription(data)","      input_tx = data.dig('serverContent', 'inputTranscription')","      return unless input_tx","","      text = input_tx.dig('parts', 0, 'text') || input_tx['text']","      @input_text_buffer \u003c\u003c text.to_s","    end","","    def handle_output_transcription(data)","      output_tx = data.dig('serverContent', 'outputTranscription')","      return unless output_tx","","      text = output_tx.dig('parts', 0, 'text') || output_tx['text']","      @output_text_buffer \u003c\u003c text.to_s","    end","","    # Must run before turnComplete handling — both can arrive in the same message and order matters.","    # Flushes transcription immediately but delays gate open by GATE_OPEN_DELAY so the speaker drains and avoids echo.","    def handle_generation_complete(data)","      return unless data.dig('serverContent', 'generationComplete')","","      emitted_audio = @model_emitting_audio","      @model_emitting_audio = false","","      flush_input_buffer","      flush_output_buffer","","      if emitted_audio","        @gate_timer&.cancel","        @gate_timer = EM::Timer.new(GATE_OPEN_DELAY) do","          unless @superseded","            Rails.logger.info('[Gemini::LiveClient] Gate open — firing on_model_turn_complete')","            @on_model_turn_complete&.call","          end","        end","      else","        Rails.logger.debug('[Gemini::LiveClient] Empty generationComplete (0 audio)')"," ,"            portfolio: portfolio_json(@portfolio),","            error: @portfolio.generation_error","          )","        end","","        json_response(portfolio: portfolio_json(@portfolio))","      end","","      # POST /api/v1/sessions/:id/portfolio/regenerate","      def regenerate","        portfolio = @session.portfolio","","        if portfolio.nil?","          return json_error(\"No portfolio found for this session\", :not_found)","        end","","        unless portfolio.failed?","          return json_error(\"Portfolio can only be regenerated when status is 'failed'\", :unprocessable_entity)","        end","","        portfolio.update!(generation_status: \"pending\", generation_error: nil)","        PortfolioGeneratorWorker.perform_async(@session.id)","","        json_response(","          message:   \"Portfolio generation queued\",","          portfolio: portfolio_json(portfolio)","        )","      end","","      # GET /api/v1/portfolios/:id/export","      def export","        format = params.fetch(:format, \"json\")","","        unless %w[pdf json].include?(format)","          return json_error(\"Format must be 'pdf' or 'json'\", :unprocessable_entity)","        end","","        unless @portfolio.complete?","          return json_error(\"Portfolio is not ready for export (status: #{@portfolio.generation_status})\", :unprocessable_entity)","        end","","        if format == \"pdf\"","          vacancy = params[:vacancy_id].present? ? Vacancy.find_by(id: params[:vacancy_id]) : nil","          pdf_data = Exports::PdfGenerator.new(portfolio: @portfolio, vacancy: vacancy).call","","          return send_data pdf_data,","                           filename:    \"portfolio-#{@portfolio.id}.pdf\",","                           type:        \"application/pdf\",","                           disposition: \"attachment\"","        end","","        # JSON export","        vacancy_id = params[:vacancy_id]","        export_data = build_export_json(@portfolio, vacancy_id)","","        send_data export_data.to_json,","                  filename:    \"portfolio-#{@portfolio.id}.json\",","                  type:        \"application/json\",","                  disposition: \"attachment\"","      end","","      # POST /api/v1/portfolios/:id/regenerate_fitgap","      def regenerate_fitgap","        portfolio  = Portfolio.find(params[:id])","        vacancy_id = params[:vacancy_id]","","        return json_error(\"vacancy_id is required\", :unprocessable_entity) if vacancy_id.blank?","","        vacancy = Vacancy.find_by(id: vacancy_id)","        return json_error(\"Vacancy not found\", :not_found) unless vacancy","","        unless portfolio.complete?","          return json_error(\"Portfolio is not ready (status: #{portfolio.generation_status})\", :unprocessable_entity)","        end","","        FitGapReport.find_by(portfolio_id: portfolio.id, vacancy_id: vacancy.id)&.destroy","        FitGapGeneratorWorker.perform_async(portfolio.id, vacancy.id)","","        render json: { status: \"generating\", message: \"Fit/gap report regeneration queued\" }, status: :accepted","      rescue ActiveRecord::RecordNotFound","        json_error(\"Portfolio not found\", :not_found)","      end","","      # POST /api/v1/portfolios/:id/fitgap","      def fitgap","        portfolio = Portfolio.find(params[:id])","","        vacancy_id = params.dig(:fitgap, :vacancy_id) || params[:vacancy_id]","        return json_error(\"vacancy_id is required\", :unprocessable_entity) if vacancy_id.blank?","","        vacancy = Vacancy.find_by(id: vacancy_id)","        return json_error(\"Vacancy not found\", :not_found) unless vacancy","","        unless portfolio.complete?","          return json_error(\"Portfolio is not ready (status: #{portfolio.generation_status})\", :unprocessable_entity)","        end","","        # Return cached report if it exists and portfolio has no new overrides","        existing = FitGapReport.find_by(portfolio_id: portfolio.id, vacancy_id: vacancy.id)","        if existing","          return json_response(report: fit_gap_json(existing))","        end","","        FitGapGeneratorWorker.perform_async(portfolio.id, vacancy.id)","        render json: { status: \"generating\", message: \"Fit/gap report generation queued\" }, status: :accepted","      rescue ActiveRecord::RecordNotFound","        json_error(\"Portfolio not found\", :not_found)","      end","","      # GET /api/v1/portfolios/:id/fitgap/:vacancy_id","      def show_fitgap","        portfolio = Portfolio.find(params[:id])","        report    = FitGapReport.find_by(portfolio_id: portfolio.id, vacancy_id: params[:vacancy_id])","","        if report.nil?","          return json_error(\"Fit/gap report not found\", :not_found)","        end","","        json_response(report: fit_gap_json(report))","      rescue ActiveRecord::RecordNotFound","        json_error(\"Portfolio not found\", :not_found)","      end","","      private","","      def set_session","        @session = Session.find(params[:id])","      rescue ActiveRecord::RecordNotFound","        json_error(\"Session not found\", :not_found)","      end","","      def set_portfolio","        # Routes use :id for both session-based and direct portfolio lookups","        # If called from session context, look up via session","        if @session","          @portfolio = @session.portfolio","        else","          @portfolio = Portfolio.find(params[:id])","        end","      rescue ActiveRecord::RecordNotFound","        json_error(\"Portfolio not found\", :not_found)","      end","","      def portfolio_json(portfolio)","        {","          id:                portfolio.id,","          session_id:        portfolio.session_id,","          candidate_id:      portfolio.candidate_id,","          generation_status: portfolio.generation_status,","          generated_at:      portfolio.generated_at,","          generation_error:  portfolio.generation_error,","          skills:            portfolio.portfolio_skills.map(&method(:portfolio_skill_json)),","          overrides:         portfolio.assessor_overrides.map(&method(:override_json))","        }","      end","","      def portfolio_skill_json(skill)","        {","          id:                skill.id,","          skill_id:          skill.skill_id,","          skill_label:       skill.skill_label,","          is_discovered:     skill.is_discovered,","          ai_level:          skill.ai_level,","          ai_confidence:     skill.ai_confidence,","          evidence:          skill.evidence_quotes,","          competency_summary: skill.competency_summary","        }","      end","","      def override_json(override)","        {","          id:             override.id,","          portfolio_skill_id: override.portfolio_skill_id,","          ai_level:       override.ai_level,","          override_level: override.override_level,","          assessor_notes: override.assessor_notes,","          overridden_by:  override.overridden_by,","          overridden_at:  override.overridden_at","        }","      end","","      def fit_gap_json(report)","        {","          id:                report.id,","          portfolio_id:      report.portfolio_id,","          vacancy_id:        report.vacancy_id,","          skill_comparisons: report.skill_comparisons,","          culture_narrative: report.culture_narrative,","          overall_narrative: report.overall_narrative,","          generated_at:      report.generated_at","        }","      end","","      def build_export_json(portfolio, vacancy_id = nil)","        data = {","          exported_at: Time.current.iso8601,","          portfolio:   portfolio_json(portfolio)","        }","","        if vacancy_id.present?","          report = FitGapReport.find_by(portfolio_id: portfolio.id, vacancy_id: vacancy_id)","          data[:fit_gap_report] = report ? fit_gap_json(report) : nil","        end","","        data","      end","    end","  end","end"],"lines":[ issed_branches":0,"total_branches":2},"app/models/coverage_map.rb":{"source":["# frozen_string_literal: true","","class CoverageMap \u003c ApplicationRecord","  STATES = %w[not_yet initiated partial covered].freeze","","  belongs_to :session","","  validates :skill_label, presence: true","  validates :state, inclusion: { in: STATES }","  validates :probe_count, numericality: { only_integer: true, greater_than_or_equal_to: 0 }","","  scope :configured,  -> { where(is_discovered: false) }","  scope :discovered,  -> { where(is_discovered: true) }","end"],"lines":[null,null,1,1,null,1,null,1,1,1,null,1,1,null],"lines_covered_percent":100.0,"covered_lines":8,"missed_lines":0,"omitted_lines":6,"total_lines":8,"branches":[],"branches_covered_percent":100.0,"covered_branches":0,"missed_branches":0,"total_branches":0},"app/models/current.rb":{"source":["# frozen_string_literal: true","","# Extracted verbatim from rakamin-api.","# Uses RequestStore for thread-safe, per-request globals.","module Current","  module Ext","    def class_accessor(name)","      Ext.module_eval do","        define_method(\"#{name}=\") { |value| RequestStore.store[name] = value }","","        define_method(name) do |&block|","          block ||= proc do","            raise \"please set Current.#{name}, e.g. Current.#{name} = obj\"","          end","          RequestStore.store.fetch(name, &block)","        end","      end","    end","","    def using(**attributes)","      old_attributes = RequestStore.store.dup","      attributes.each { |k, v| public_send(\"#{k}=\", v) }","      yield","    ensure","      RequestStore.store.replace(old_attributes)","    end","","    def clear","      RequestStore.clear!","      Array(@after_clear).each(&:call)","    end","","    def after_clear(&block)","      (@after_clear ||= []) \u003c\u003c block","    end","  end","","  extend Ext","","  # Mirrors rakamin-api Current accessors","  class_accessor :user        # OpenStruct with id, role (from JWT; no DB lookup)","
