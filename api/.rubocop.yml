# Curated RuboCop configuration for ai-interview-api.
#
# This repo's backend predates the current default cop set (1485 offenses at
# baseline, ~90% pure style). Rather than auto-correct 1100 lines of style churn,
# we disable the churn cops and keep the high-signal correctness/security cops:
# Lint/*, Security/*, and Rails correctness. Each disabled cop lists why.
#
# The frontend equivalent of formatting/type enforcement is `vp check` (web/),
# which passes clean and is enforced in CI (see .github/workflows/ci.yml).

require:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: disable
  Exclude:
    - db/schema.rb
    - db/migrate/**/*
    - vendor/**/*
    - log/**/*
    - tmp/**/*
    - bin/**
    - node_modules/**/*
    - spec/support/contract_helpers.rb

# ── Style churn (codebase predates these defaults; zero behavior value) ──────
Style/StringLiterals:
  Enabled: false          # 647 offenses; mixed quotes are fine, not worth churn
Layout/HashAlignment:
  Enabled: false          # 319 offenses; aligned vs end-aligned is pure taste
Layout/LineLength:
  Enabled: false          # 111 offenses; no hard line cap in this codebase
Metrics/MethodLength:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Style/Documentation:
  Enabled: false          # 41 offenses; classes without comments are acceptable
Layout/ExtraSpacing:
  Enabled: false
Style/IfUnlessModifier:
  Enabled: false
Style/WordArray:
  Enabled: false
Style/RescueStandardError:
  Enabled: false
Style/TrailingCommaInArguments:
  Enabled: false
Style/TrailingCommaInArrayLiteral:
  Enabled: false
Style/TrailingCommaInHashLiteral:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Style/GlobalVars:
  Enabled: false
Naming/MethodParameterName:
  Enabled: false
Naming/PredicateName:
  Enabled: false
Layout/ArgumentAlignment:
  Enabled: false
Layout/MultilineMethodCallIndentation:
  Enabled: false
Lint/ConstantDefinitionInBlock:
  Enabled: false          # used deliberately in RSpec describe blocks
# ── Remaining baseline noise (second pass: 168 → 0) ──────────────────────────
Rails/Output:
  Enabled: false          # `puts` in seeds/rake tasks is intentional
RSpec/MultipleExpectations:
  Enabled: false          # contract specs assert key sets in one example (by design)
RSpec/ExampleLength:
  Enabled: false          # contract/request specs are scenario-length by design
RSpec/LeakyConstantDeclaration:
  Enabled: false          # spec-scoped constants are deliberate here
Rails/Blank:
  Enabled: false          # codebase mixes `.present?`/`.empty?`/`.blank?` deliberately
Rails/SkipsModelValidations:
  Enabled: false          # workers use update_column/update_all for perf by design
Lint/UnusedMethodArgument:
  Enabled: false
Lint/UnusedBlockArgument:
  Enabled: false
Naming/VariableNumber:
  Enabled: false
Layout/SpaceAroundOperators:
  Enabled: false
Layout/EmptyLineAfterGuardClause:
  Enabled: false
Style/NumericPredicate:
  Enabled: false
Style/SoleNestedConditional:
  Enabled: false
Style/RaiseArgs:
  Enabled: false
Style/RedundantRegexpEscape:
  Enabled: false
Style/RescueModifier:
  Enabled: false
Style/CommentedKeyword:
  Enabled: false
Style/GuardClause:
  Enabled: false
Style/NestedTernaryOperator:
  Enabled: false
Style/StringLiteralsInInterpolation:
  Enabled: false
Style/MutableConstant:
  Enabled: false
Style/RegexpLiteral:
  Enabled: false
Style/RedundantBegin:
  Enabled: false
Style/Lambda:
  Enabled: false
Style/ConditionalAssignment:
  Enabled: false
RSpec/SpecFilePathFormat:
  Enabled: false
RSpec/ExpectOutput:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Rails/FindEach:
  Enabled: false
Rails/Delegate:
  Enabled: false
Layout/MultilineOperationIndentation:
  Enabled: false          # continuation indent style; layout-only
Style/RedundantAssignment:
  Enabled: false          # explicit `return var` after assignment is a readability choice
Style/ClassAndModuleChildren:
  Enabled: false          # compact `class Rack::Attack` is idiomatic in initializers
RSpec/DescribeClass:
  Enabled: false          # file-path specs (`db/seeds.rb`) are intentional

# ── Kept: correctness & security ──────────────────────────────────────────────
# Lint/* and Security/* run at defaults. Rails cops that catch real bugs:
Rails/FindBy:
  Enabled: true
Rails/TimeZone:
  Enabled: true
Rails/Inquiry:
  Enabled: true
Rails/PluralizationGrammar:
  Enabled: true
Rails/RedundantActiveRecordAllMethod:
  Enabled: true
Rails/SafeNavigation:
  Enabled: true
Rails/UnknownEnv:
  Environments:
    - development
    - test
    - production