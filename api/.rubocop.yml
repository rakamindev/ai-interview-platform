inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "db/schema.rb"
    - "log/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "app/channels/audio_websocket_middleware.rb"
    - "config/routes.rb"
    - "db/seeds.rb"
    - "spec/**/*"

Style/Documentation:
  Enabled: false
