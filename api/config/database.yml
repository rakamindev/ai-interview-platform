default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV['DATABASE_URL'] %>
  username: <%= ENV['DB_USERNAME'] %>
  password: <%= ENV['DB_PASSWORD'] %>
  host: <%= ENV['DB_HOST'] %>
  port: <%= ENV.fetch('DB_PORT', 5432) %>
  pool: <%= ENV.fetch('DB_POOL', ENV.fetch('RAILS_MAX_THREADS', 5).to_i + 10) %>
  timeout: 5000
  schema_search_path: "ai_interview,public"

development:
  <<: *default
  database: <%= ENV.fetch('DB_NAME', 'rakamin_development') %>

test:
  <<: *default
  database: <%= ENV.fetch('DB_NAME', 'rakamin_test') %>

staging:
  <<: *default

production:
  <<: *default
