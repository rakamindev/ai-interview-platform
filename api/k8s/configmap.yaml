# Non-secret runtime configuration for ai-interview (API + Sidekiq).
# Credentials live in the Secret `ai-interview-secrets` (see secret.example.yaml).
#
# BEFORE APPLY — exactly two values must be edited for a real environment:
#   DB_HOST          — the shared PostgreSQL endpoint (must match rakamin-api's DB)
#   ALLOWED_ORIGINS  — comma-separated frontend origin(s) for CORS
#                      (ENV.fetch'd at boot; wrong values break CORS, not boot)
# Everything else applies as-is.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-interview-config
  namespace: default
data:
  DB_HOST: "<your-db-host>"
  DB_NAME: "<your-db-name>"
  DB_PORT: "5432"
  DB_POOL: "26"           # RAILS_MAX_THREADS(16) + 10 headroom (matches database.yml formula)
  RAILS_ENV: production
  RAILS_LOG_LEVEL: info
  WEB_CONCURRENCY: "2"
  RAILS_MAX_THREADS: "16"
  RAILS_MIN_THREADS: "16"
  GEMINI_LIVE_MODEL: gemini-2.0-flash-live-preview
  GEMINI_FLASH_MODEL: gemini-2.5-flash
  GEMINI_PRO_MODEL: gemini-2.5-pro
  PROACTIVE_RECONNECT_AFTER: "510"
  APP_BASE_URL: https://ai-interview-api.rakamin.com
  ALLOWED_ORIGINS: "https://<your-frontend-domain>"
  REDIS_URL: "redis://ai-interview-redis:6379/1"
