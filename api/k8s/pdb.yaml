# PodDisruptionBudget — guarantee availability during voluntary disruptions
# (node drains, autoscaler scale-down). API is replicas: 2 on 2 nodes with
# required podAntiAffinity (1 pod/node), so minAvailable: 1 allows one node
# drain at a time without dropping the service to zero.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-interview-api-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-interview-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-interview-sidekiq-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-interview-sidekiq
