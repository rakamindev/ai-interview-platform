name: ai-interview-platform

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rakamin_development}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-dev:
    build:
      context: .
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &app_env
      RAILS_ENV: ${RAILS_ENV:-development}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-compose-development-secret}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-rakamin_development}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      GEMINI_STUB: ${GEMINI_STUB:-true}
      GEMINI_STUB_MODE: ${GEMINI_STUB_MODE:-valid}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      GEMINI_FLASH_MODEL: ${GEMINI_FLASH_MODEL:-gemini-3.5-flash}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-3.5-flash}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
    ports:
      - "3001:3001"
    volumes:
      - bundle:/usr/local/bundle
      - .:/ai-interview
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]

  sidekiq:
    build:
      context: .
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app_env
    volumes:
      - bundle:/usr/local/bundle
      - .:/ai-interview
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

volumes:
  pgdata:
  bundle:
