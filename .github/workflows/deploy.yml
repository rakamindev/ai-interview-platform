name: Deploy

# Gated production deploy. Triggered manually (recommended) or on push to main.
# Out of scope (infra): provisioning GKE credentials, registry auth, and the
# SENTRY_DSN — wire them as repository secrets/variables before first use.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: asia-southeast2-docker.pkg.dev
  PROJECT_ID: rakamin-poc
  IMAGE_REPO: ${{ vars.IMAGE_REPO || 'rakamin-images' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & push immutable images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GKE_SA_EMAIL }}

      - name: Configure docker for GAR
        run: gcloud auth configure-docker $REGISTRY

      - name: Build & push API image
        working-directory: api
        run: |
          docker build -t $REGISTRY/$PROJECT_ID/$IMAGE_REPO/ai-interview-api:$IMAGE_TAG .
          docker push $REGISTRY/$PROJECT_ID/$IMAGE_REPO/ai-interview-api:$IMAGE_TAG

      - name: Build & push Web image
        working-directory: web
        run: |
          docker build -t $REGISTRY/$PROJECT_ID/$IMAGE_REPO/ai-interview-web:$IMAGE_TAG .
          docker push $REGISTRY/$PROJECT_ID/$IMAGE_REPO/ai-interview-web:$IMAGE_TAG

  deploy:
    name: Migrate & roll out
    runs-on: ubuntu-latest
    environment: production
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GKE_SA_EMAIL }}

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_REGION }}

      - name: Run pre-deploy migration Job
        run: |
          kubectl apply -f api/k8s/migration-job.yaml
          kubectl wait --for=condition=complete --timeout=300s job/ai-interview-migrate

      - name: Roll out API to immutable tag
        run: |
          kubectl set image deployment/ai-interview-api \
            ai-interview-api=$REGISTRY/$PROJECT_ID/$IMAGE_REPO/ai-interview-api:$IMAGE_TAG
          kubectl rollout status deployment/ai-interview-api --timeout=300s

      - name: Roll out Sidekiq to immutable tag
        run: |
          kubectl set image deployment/ai-interview-sidekiq \
            ai-interview-sidekiq=$REGISTRY/$PROJECT_ID/$IMAGE_REPO/ai-interview-api:$IMAGE_TAG
          kubectl rollout status deployment/ai-interview-sidekiq --timeout=300s

      - name: Roll out Web to immutable tag
        run: |
          kubectl set image deployment/ai-interview-web \
            ai-interview-web=$REGISTRY/$PROJECT_ID/$IMAGE_REPO/ai-interview-web:$IMAGE_TAG
          kubectl rollout status deployment/ai-interview-web --timeout=300s

      - name: Verify readiness
        run: |
          kubectl wait --for=condition=ready --timeout=120s pod -l app=ai-interview-api
          kubectl wait --for=condition=ready --timeout=120s pod -l app=ai-interview-web