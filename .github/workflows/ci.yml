name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (RSpec + Rubocop lint)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # Throwaway CI database — trust auth, no password (no secret needed).
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: rakamin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: postgres
      DB_PASSWORD: ""
      DB_NAME: rakamin_test
      DB_PORT: 5432
      RAILS_ENV: test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (libpq for pg gem)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.2'
      - name: Bundle install
        run: bundle install --jobs 4 --retry 3
      - name: Prepare test database
        run: bundle exec rails db:prepare
      - name: Rubocop (lint-only gate)
        # Full rubocop has ~1400 pre-existing style offenses in the scaffold;
        # lint cops only catch real bugs and stay clean.
        run: bundle exec rubocop --lint
      - name: RSpec
        run: bundle exec rspec

  frontend:
    name: Frontend (typecheck + build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck & build
        run: npm run build
      - name: Unit tests (Vitest)
        run: npm test
