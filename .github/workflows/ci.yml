name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway container that only lives for this job; no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      RAILS_ENV: test
      CI: "true"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_NAME: rakamin_test
      # Read at boot by config/initializers/cors.rb.
      ALLOWED_ORIGINS: http://localhost:5173
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - name: Build the database from migrations
        run: bundle exec rails db:create db:migrate
      - name: Migrations roll back and re-apply cleanly
        run: |
          bundle exec rails db:rollback STEP=2
          bundle exec rails db:migrate
      - name: Schema file matches migrations
        run: git diff --exit-code db/schema.rb
      - name: RSpec
        run: bundle exec rspec

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
