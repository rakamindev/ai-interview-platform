name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (RSpec + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      RAILS_ENV: test
      CI: "true"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: rakamin_test
      REDIS_URL: redis://localhost:6379/1
      # Throwaway value for signing test JWTs only; not a real secret.
      SECRET_KEY_BASE: ci-only-not-a-secret-0000000000000000000000000000000000000000
      GEMINI_API_KEY: ci-unused
      ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - name: Eager load (production boots with eager_load = true)
        run: bundle exec rails zeitwerk:check
      - name: Migrations apply from empty, roll back one step, and re-apply
        run: |
          bundle exec rails db:create
          bundle exec rails db:migrate
          bundle exec rails db:rollback STEP=1
          bundle exec rails db:migrate
          git diff --exit-code db/schema.rb
      - name: RSpec
        run: |
          bundle exec rails db:drop db:create db:schema:load
          bundle exec rspec --format progress

  web:
    name: Web (typecheck + Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
