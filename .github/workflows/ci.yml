name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/*", "chore/*", "feat/*", "test/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend - RSpec
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    # Global ENV variables for all steps in this job
    env:
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_URL: redis://localhost:6379/1
      RAILS_ENV: test
      ALLOWED_ORIGINS: 'http://localhost:5173,http://127.0.0.1:5173'

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.2'
          bundler-cache: true
          working-directory: ./api

      - name: Setup Database
        working-directory: ./api
        run: bundle exec rails db:create db:schema:load

      - name: Run RSpec
        working-directory: ./api
        run: bundle exec rspec

  frontend:
    name: Frontend - Type Check + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Type Check
        run: npx tsc --noEmit
        
      - name: Run Vitest
        run: npm run test
