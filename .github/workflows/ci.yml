name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (RSpec)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rakamin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: rakamin_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
      ALLOWED_ORIGINS: http://localhost:5173
      SECRET_KEY_BASE: ci-secret-key-base-not-used-outside-ci

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true

      # db:schema:load would build a different database: db/schema.rb does not
      # record the ai_interview schema every table lives in.
      - name: Prepare the test database
        run: bundle exec rails db:create db:migrate

      - name: RSpec
        run: bundle exec rspec

  web:
    name: Web (tsc + Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Vitest
        run: npm test
