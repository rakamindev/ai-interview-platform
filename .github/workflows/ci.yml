name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (RSpec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.2"
          bundler-cache: true
          working-directory: api

      # Figaro loads config/application.yml into ENV, which database.yml reads.
      # We generate a test-only file here (the real one is git-ignored).
      - name: Configure app secrets (Figaro)
        run: |
          cat > config/application.yml <<'YML'
          SECRET_KEY_BASE: "test"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_NAME: "rakamin"
          DB_USERNAME: "postgres"
          DB_PASSWORD: "postgres"
          GEMINI_API_KEY: "test"
          GEMINI_LIVE_MODEL: "test"
          GEMINI_FLASH_MODEL: "test"
          GEMINI_PRO_MODEL: "test"
          APP_BASE_URL: "http://localhost:3001"
          TOKEN_EXPIRATION_TIME: "259200"
          ALLOWED_ORIGINS: "*"
          REDIS_URL: "redis://localhost:6379/1"
          YML

      - name: Prepare test database
        # NOTE: we migrate (not schema:load) because the app lives in a custom
        # `ai_interview` PostgreSQL schema created by a raw-SQL migration.
        run: bundle exec rails db:create db:migrate

      - name: RSpec
        run: bundle exec rspec

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
