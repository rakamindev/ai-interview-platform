name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api - rspec + zeitwerk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rakamin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Rack::Attack stores login/candidate throttles in Redis. Without a
      # reachable Redis the request specs hang on the cache client's retries.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
      # No GEMINI_API_KEY here on purpose: the suite runs on the mock
      # client, so CI can never spend tokens or depend on Google's uptime.
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.11"
          bundler-cache: true
          working-directory: api

      - name: Load test schema
        run: bundle exec rails db:schema:load

      - name: Zeitwerk eager-load check
        run: bundle exec rails zeitwerk:check

      - name: RSpec
        run: bundle exec rspec

  web:
    name: web - vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit and component tests
        run: npm test

      - name: Type-check and build
        run: npm run build
