name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- BACKEND TESTING & LINTING ---
  backend:
    name: Backend CI (Rails)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rails
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rakamin_test
        ports:
          - 5432:5432
        # Wait until postgres is ready to accept connections
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: rails
      DB_NAME: rakamin_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.2'
          bundler-cache: true # automatically runs bundle install and caches gems
          working-directory: api

      - name: Set up Database Schema
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Run Backend Specs (RSpec)
        run: |
          bundle exec rspec

  # --- FRONTEND TESTING & LINTING ---
  frontend:
    name: Frontend CI (Vite & React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Frontend Tests
        run: npm run test -- --run

      - name: Build Application
        run: npm run build

