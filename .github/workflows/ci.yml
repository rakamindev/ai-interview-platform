name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (RSpec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      RAILS_ENV: test
      CI: "true"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
      # Throw-away values for the test run only; real secrets never live in the repo.
      SECRET_KEY_BASE: ci-only-not-a-secret-0123456789abcdef0123456789abcdef
      GEMINI_API_KEY: ci-only-fake-key
      ALLOWED_ORIGINS: http://localhost:5173
      APP_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.2"
          bundler-cache: true
          working-directory: api
      - name: Create database and run migrations
        run: bundle exec rails db:create db:migrate
      - name: Migrations are reversible (rollback the newest, then re-apply)
        run: |
          bundle exec rails db:rollback STEP=1
          bundle exec rails db:migrate
      - name: schema.rb is in sync with the migrations
        run: git diff --exit-code db/schema.rb
      - name: RSpec
        run: bundle exec rspec --format documentation

  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
