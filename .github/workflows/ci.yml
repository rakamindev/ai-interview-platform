name: CI/CD Pipeline

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    name: Frontend (React & Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit & integration tests
        run: npm run test

      - name: Build TypeScript & Vite assets
        run: npm run build

  api-tests:
    name: Backend (Rails & RSpec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rakamin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      PGHOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME: rakamin_test
      REDIS_URL: redis://127.0.0.1:6379/1
      ALLOWED_ORIGINS: "*"
      GEMINI_API_KEY: test_gemini_api_key_for_ci
      APP_BASE_URL: http://localhost:3001
      SECRET_KEY_BASE: test_secret_key_base_for_ci_pipeline_only
      JWT_SECRET: test_jwt_secret_token_1234567890
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.2"
          bundler-cache: true
          working-directory: api

      - name: Setup database
        run: |
          bundle exec rails db:prepare

      - name: Run RSpec suite
        run: |
          bundle exec rspec --format documentation
