name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  api:
    name: API (RSpec)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rakamin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.2"
      - name: Install gems
        working-directory: api
        run: bundle install
      - name: Prepare config
        run: |
          cp config/application.yml.sample config/application.yml
          sed -i 's/your_secret_key_base_here/rakamin-api/' config/application.yml
      - name: Prepare DB
        env:
          RAILS_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: ""
          DB_NAME: rakamin_test
        run: bundle exec rails db:create db:migrate
      - name: Run RSpec
        env:
          RAILS_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: ""
          DB_NAME: rakamin_test
          REDIS_URL: redis://127.0.0.1:6379/1
        run: bundle exec rspec

  web:
    name: Web (Vitest + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npx tsc --noEmit