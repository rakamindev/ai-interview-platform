name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API — rspec + rubocop
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          # Trust auth: the container is ephemeral and bound to the job only —
          # no password is set or transmitted. Avoids committing any credential.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rakamin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      CI: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: rakamin_test
      DB_USERNAME: postgres
      REDIS_URL: redis://127.0.0.1:6379/1
      SECRET_KEY_BASE: ci-only-secret-key-base-for-testing
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.2"
          bundler-cache: true
      - name: Prepare test database
        run: |
          bundle exec rails db:create db:schema:load
      - name: Run RSpec
        run: bundle exec rspec
      - name: Run RuboCop
        run: bundle exec rubocop --format simple

  frontend:
    name: Web — vp check + vp test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - name: Set up vite plus
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"
          cache: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.21.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run vp check (format + lint + type)
        run: pnpm exec vp check
      - name: Run tests with coverage
        run: pnpm exec vp test

  docker:
    name: Build images from clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        working-directory: api
        run: docker build -t ai-interview-api:ci .
      - name: Build Web image
        working-directory: web
        run: docker build -t ai-interview-web:ci .

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        uses: docker://zricethezav/gitleaks:latest
        with:
          args: detect --source . --redact --log-opts="--all"