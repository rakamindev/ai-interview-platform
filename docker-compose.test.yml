# Test-only Compose stack for the AI Interview API.
#
# Spins up PostgreSQL + the API test image (Dockerfile.test) and runs the RSpec
# suite. Shared Docker network: the `api` service reaches postgres via the
# service name `postgres`, exactly like CI.
#
# Usage:
#   docker compose -f docker-compose.test.yml run --rm api bundle exec rspec
#   docker compose -f docker-compose.test.yml run --rm api bundle exec rails db:migrate
#   docker compose -f docker-compose.test.yml run --rm api bundle exec rubocop

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: ai_interview_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_interview_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.test
    environment:
      RAILS_ENV: test
      RACK_ENV: test
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_NAME: ai_interview_test
      SECRET_KEY_BASE: rakamin-api
      ALLOWED_ORIGINS: http://localhost:5173
      APP_BASE_URL: http://localhost:3001
      REDIS_URL: redis://localhost:6379/1
      GEMINI_API_KEY: test-key
      GEMINI_LIVE_MODEL: gemini-2.0-flash-live-001
      GEMINI_FLASH_MODEL: gemini-2.0-flash-001
      GEMINI_PRO_MODEL: gemini-2.0-pro-001
    volumes:
      - ./api:/ai-interview
    depends_on:
      postgres:
        condition: service_healthy
